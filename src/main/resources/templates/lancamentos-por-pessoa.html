<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Lançamentos por Pessoa</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 20mm 15mm 25mm 15mm;

            @bottom-left {
                content: "Gerado em: ";
                font-family: Arial, sans-serif;
                font-size: 10px;
                color: #555555;
            }

            @bottom-right {
                content: "Página " counter(page);
                font-family: Arial, sans-serif;
                font-size: 10px;
                color: #555555;
            }
        }

        body {
            font-family: Arial, sans-serif;
            color: #333333;
            line-height: 1.25;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 18px;
            font-weight: normal;
            color: #222222;
            margin-bottom: 25px;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: #CFC8C8;
            color: #000000;
            font-weight: bold;
            font-size: 12px;
            padding: 8px;
            border: 1px solid #999999;
            text-align: center;
        }

        td {
            padding: 8px;
            font-size: 12px;
            border: 1px solid #999999;
            text-align: center;
        }

        .text-left {
            text-align: left;
        }

        .text-right {
            text-align: right;
        }
    </style>
</head>

<body>

    <h1>
        Lançamentos por pessoa de
        <span th:text="${dataInicio}">01/01/2026</span>
        até
        <span th:text="${dataFim}">31/01/2026</span>
    </h1>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">Tipo</th>
                <th style="width: 65%;" class="text-left">Pessoa</th>
                <th style="width: 20%;" class="text-right">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="estatistica : ${estatisticas}">
                <td th:text="${estatistica.tipo.descricao}">RECEITA</td>
                <td class="text-left" th:text="${estatistica.pessoa.nome}">Nome</td>
                <td class="text-right" th:text="${#numbers.formatCurrency(estatistica.total)}">R$ 0,00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(estatisticas)}">
                <td colspan="3">Nenhum registro encontrado para o período selecionado.</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
