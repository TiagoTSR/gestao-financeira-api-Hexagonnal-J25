spring.application.name=gestao-financeira-api-Hexagonal-J25

spring.datasource.url=${DB_URL2:jdbc:postgresql://localhost:5435/gestao_financeira}
spring.datasource.username=${DB_USER1:postgres}
spring.datasource.password=${DB_PASSWORD1:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=disable

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.datasource.flyway.enabled=true
spring.datasource.flyway.locations=classpath:db/migration
server.port=${SERVER_PORT:8080}

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-secreta-e-segura-12345678}

api.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
api.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100000}
api.rate-limit.duration-in-minutes=${RATE_LIMIT_DURATION_IN_MINUTES:1}

# HikariCP Connection Pool Tuning para Alta Concorrência
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:80}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:20}
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.idle-timeout=30000

# Embedded Tomcat Threads Tuning & Virtual Threads
spring.threads.virtual.enabled=true
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:250}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:30}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}
server.tomcat.max-connections=${TOMCAT_MAX_CONN:10000}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.concurrency=${RABBIT_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${RABBIT_MAX_CONCURRENCY:10}
spring.rabbitmq.listener.simple.prefetch=${RABBIT_PREFETCH:5}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false


