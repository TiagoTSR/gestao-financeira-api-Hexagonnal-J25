version: '3.8'

services:
  meu-postgres:
    image: postgres:16-alpine
    container_name: gestao_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER_LOCAL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_LOCAL}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_LOCAL} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meu-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gestao_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5


  minha-api-spring:
    image: gestao-financeira-api:latest
    container_name: spring_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      meu-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL2: jdbc:postgresql://meu-postgres:5432/${POSTGRES_DB_NAME}
      DB_USER1: ${POSTGRES_USER_LOCAL}
      DB_PASSWORD1: ${POSTGRES_PASSWORD_LOCAL}

volumes:
  postgres_data:
    name: gestao_financeira_postgres_data